# ==============================================================================
# Apache VirtualHost for ims.jaiprakashhospitals.com
# Use this configuration if Apache is serving ports 80 & 443
# ==============================================================================

<VirtualHost *:80>
    ServerName ims.jaiprakashhospitals.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName ims.jaiprakashhospitals.com
    DocumentRoot /home/ims/client/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ims.jaiprakashhospitals.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ims.jaiprakashhospitals.com/privkey.pem

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Reverse proxy for Socket.io WebSockets
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:5000/socket.io/$1 [P,L]

    # Reverse proxy for API and Socket.io Polling
    ProxyPreserveHost On
    ProxyPass /socket.io http://127.0.0.1:5000/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:5000/socket.io

    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # Static file uploads
    Alias /uploads /home/ims/server/uploads
    <Directory /home/ims/server/uploads>
        Require all granted
        Options -Indexes
    </Directory>

    # React SPA routing (try files then index.html)
    <Directory /home/ims/client/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride All
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog /var/log/httpd/ims-error.log
    CustomLog /var/log/httpd/ims-access.log combined
</VirtualHost>
